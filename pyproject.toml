[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afterdark-prompt-generator"
version = "1.0.0"
description = "Enterprise-grade prompt generator for ChatGPT and Claude Code with team collaboration features"
readme = "README.md"
authors = [
    {name = "AfterDark", email = "security@afterdark.tech"}
]
license = {text = "MIT"}
keywords = ["prompt", "generator", "ai", "chatgpt", "claude", "collaboration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.3",
    "flask-talisman>=1.1.0",
    "flask-cors>=4.0.0",
    "pydantic>=2.9.2",
    "structlog>=24.4.0",
    "flask-caching>=2.3.0",
    "redis>=5.0.8",
    "flask-limiter>=3.8.0",
    "prometheus-flask-exporter>=0.23.1",
    "gunicorn>=22.0.0",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-flask>=1.3.0",
    "mypy>=1.11.2",
    "ruff>=0.6.7",
    "safety>=3.2.8",
]

[project.scripts]
prompt-gen = "prompt_gen.cli:main"

[tool.setuptools]
packages = ["prompt_gen"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "flask_caching.*",
    "flask_limiter.*",
    "flask_talisman.*",
    "prometheus_flask_exporter.*",
    "pyperclip.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["prompt_gen", "."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "app_old.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
