---
apiVersion: v1
kind: Namespace
metadata:
  name: prompt-generator

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prompt-generator-config
  namespace: prompt-generator
data:
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  CACHE_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  METRICS_ENABLED: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: prompt-generator-secrets
  namespace: prompt-generator
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  REDIS_URL: "redis://redis:6379/0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-generator
  namespace: prompt-generator
  labels:
    app: prompt-generator
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prompt-generator
  template:
    metadata:
      labels:
        app: prompt-generator
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: prompt-generator
          image: prompt-generator:latest  # Replace with your registry/image:tag
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: FLASK_DEBUG
              value: "false"

          envFrom:
            - configMapRef:
                name: prompt-generator-config
            - secretRef:
                name: prompt-generator-secrets

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prompt-generator
  namespace: prompt-generator
  labels:
    app: prompt-generator
spec:
  type: ClusterIP
  selector:
    app: prompt-generator
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prompt-generator-hpa
  namespace: prompt-generator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prompt-generator
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prompt-generator
  namespace: prompt-generator
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - prompt-generator.example.com  # Replace with your domain
      secretName: prompt-generator-tls
  rules:
    - host: prompt-generator.example.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prompt-generator
                port:
                  number: 80
