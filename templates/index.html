<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prompt Generator Pro</title>
<style>
:root{--transition:all .3s ease}
[data-theme=dark]{--bg-primary:#0b1020;--bg-secondary:#111a33;--bg-tertiary:#1a2744;--bg-input:#0c1329;--text-primary:#e6e9f2;--text-secondary:#b8c0d9;--border-color:rgba(255,255,255,.12);--border-subtle:rgba(255,255,255,.08);--accent-primary:#6c7cff;--accent-hover:#5a6de8;--accent-text:#0b1020;--error-color:#ffb3b3;--success-color:#4ade80;--shadow:rgba(0,0,0,.3)}
[data-theme=light]{--bg-primary:#f5f7fa;--bg-secondary:#fff;--bg-tertiary:#f8fafc;--bg-input:#fff;--text-primary:#1a202c;--text-secondary:#4a5568;--border-color:rgba(0,0,0,.12);--border-subtle:rgba(0,0,0,.08);--accent-primary:#6c7cff;--accent-hover:#5a6de8;--accent-text:#fff;--error-color:#e53e3e;--success-color:#22c55e;--shadow:rgba(0,0,0,.1)}
*{transition:background-color .3s ease,color .3s ease,border-color .3s ease;box-sizing:border-box}
body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:var(--bg-primary);color:var(--text-primary)}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{margin:0;font-size:28px}
.theme-toggle{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:24px;padding:6px;display:flex;gap:4px;box-shadow:0 2px 8px var(--shadow)}
.theme-toggle button{background:0 0;border:0;padding:8px 12px;border-radius:18px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-secondary);transition:var(--transition);display:flex;align-items:center;gap:6px}
.theme-toggle button.active{background:var(--accent-primary);color:var(--accent-text)}
.tabs{display:flex;gap:8px;background:var(--bg-secondary);border-radius:12px;padding:6px;margin-bottom:20px;box-shadow:0 2px 8px var(--shadow);overflow-x:auto}
.tab{background:0 0;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;color:var(--text-secondary);transition:var(--transition);white-space:nowrap}
.tab.active{background:var(--accent-primary);color:var(--accent-text)}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:12px;padding:20px;box-shadow:0 4px 12px var(--shadow);margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12px;color:var(--text-secondary);margin:10px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-color);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent-primary);box-shadow:0 0 0 3px rgba(108,124,255,.1)}
textarea{min-height:96px;resize:vertical}
button{background:var(--accent-primary);border:0;color:var(--accent-text);font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;transition:var(--transition)}
button:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(108,124,255,.3)}
button:active{transform:translateY(0)}
button.secondary{background:0 0;color:var(--text-primary);border:1px solid var(--border-color)}
button.secondary:hover:not(:disabled){background:var(--bg-input);border-color:var(--accent-primary)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--text-secondary);margin-top:8px;font-style:italic}
.error{color:var(--error-color);font-size:13px;margin-top:10px;font-weight:600}
.success{color:var(--success-color);font-size:13px;margin-top:10px;font-weight:600}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.prompt-card{background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:10px;padding:16px;cursor:pointer;transition:var(--transition)}
.prompt-card:hover{border-color:var(--accent-primary);transform:translateY(-2px)}
.prompt-card h3{margin:0 0 8px;font-size:16px}
.prompt-card p{margin:0 0 12px;font-size:13px;color:var(--text-secondary)}
.prompt-card .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--accent-primary);color:var(--accent-text);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:var(--bg-secondary);border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{margin:0}
.close{background:0 0;border:0;font-size:24px;cursor:pointer;color:var(--text-secondary);padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.close:hover{background:var(--bg-input);color:var(--text-primary)}
@media (max-width:860px){.row{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start;gap:12px}.library-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-theme="dark">
<div class="wrap">
<div class="header">
<h1>Prompt Generator Pro</h1>
<div class="theme-toggle">
<button id="theme-dark" class="active"><span>🌙</span><span>Dark</span></button>
<button id="theme-light"><span>☀️</span><span>Light</span></button>
</div>
</div>
<div class="tabs">
<button class="tab active" data-tab="generator">📝 Generator</button>
<button class="tab" data-tab="playground">🎮 Playground</button>
<button class="tab" data-tab="library">📚 Library</button>
<button class="tab" data-tab="keys">🔑 API Keys</button>
</div>
<div id="generator" class="tab-content active">
<div class="card">
<div class="row">
<div><label for="target">Target</label><select id="target"><option value="chatgpt">ChatGPT</option><option value="claude_code">Claude Code</option></select></div>
<div><label for="tone">Tone (optional)</label><input id="tone" placeholder="e.g. concise, direct"/></div>
</div>
<label for="task">Task (required)</label>
<textarea id="task" placeholder="What do you want the model to do?"></textarea>
<div class="row">
<div><label for="context">Context</label><textarea id="context" placeholder="Important background, codebase details..."></textarea></div>
<div><label for="constraints">Constraints</label><textarea id="constraints" placeholder="Restrictions, tech stack..."></textarea></div>
</div>
<label for="deliverables">Deliverables</label>
<textarea id="deliverables" placeholder="What the output must include..."></textarea>
<div class="actions">
<button id="generate">Generate</button>
<button class="secondary" id="copy">Copy</button>
<button class="secondary" id="save">Save to Library</button>
</div>
<div class="error" id="gen-error" style="display:none"></div>
<div class="success" id="gen-success" style="display:none"></div>
<div style="margin-top:14px">
<label for="output">Generated prompt</label>
<textarea id="output" readonly></textarea>
</div>
</div>
</div>
<div id="playground" class="tab-content">
<div class="card">
<h2 style="margin:0 0 16px">Test Prompts with AI Models</h2>
<div class="row">
<div><label for="pg-provider">Provider</label><select id="pg-provider"><option value="detached">Detached Mode (No API)</option><option value="anthropic">Anthropic Claude</option><option value="openai">OpenAI ChatGPT</option><option value="openrouter">OpenRouter</option></select></div>
<div><label for="pg-model">Model</label><select id="pg-model"><option value="detached">Detached</option></select></div>
</div>
<div class="row">
<div><label for="pg-key-select">Stored API Key (optional)</label><select id="pg-key-select"><option value="">Use inline key or detached mode</option></select></div>
<div><label for="pg-key-inline">Or Enter API Key</label><input id="pg-key-inline" type="password" placeholder="sk-..." autocomplete="off"/></div>
</div>
<label for="pg-prompt">Prompt to Test</label>
<textarea id="pg-prompt" style="min-height:150px" placeholder="Enter your prompt here..."></textarea>
<div class="actions">
<button id="pg-execute">Execute</button>
<button class="secondary" id="pg-clear">Clear</button>
</div>
<div class="error" id="pg-error" style="display:none"></div>
<div style="margin-top:14px">
<label for="pg-response">Response</label>
<textarea id="pg-response" readonly style="min-height:200px"></textarea>
</div>
<div id="pg-meta" style="margin-top:10px;font-size:12px;color:var(--text-secondary)"></div>
</div>
</div>
<div id="library" class="tab-content">
<div class="card">
<div class="row">
<div><input id="lib-search" placeholder="Search prompts..."/></div>
<div style="display:flex;gap:10px">
<button id="lib-refresh">Refresh</button>
<button class="secondary" id="lib-favorites">Favorites Only</button>
</div>
</div>
</div>
<div class="library-grid" id="library-grid"><p style="text-align:center;color:var(--text-secondary)">Loading...</p></div>
</div>
<div id="keys" class="tab-content">
<div class="card">
<h2 style="margin:0 0 16px">Add API Key</h2>
<p style="color:var(--text-secondary);margin:0 0 16px;font-size:14px">Store your API keys securely (encrypted at rest). Keys are never logged or exposed.</p>
<div class="row">
<div><label for="key-provider">Provider</label><select id="key-provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option></select></div>
<div><label for="key-name">Key Name</label><input id="key-name" placeholder="e.g. My Claude Key"/></div>
</div>
<label for="key-value">API Key</label>
<input id="key-value" type="password" placeholder="sk-..." autocomplete="off"/>
<div class="actions">
<button id="key-add">Add Key</button>
</div>
<div class="error" id="key-error" style="display:none"></div>
<div class="success" id="key-success" style="display:none"></div>
</div>
<div class="card" id="keys-list"><p style="text-align:center;color:var(--text-secondary)">Loading...</p></div>
</div>
</div>
<div id="prompt-modal" class="modal">
<div class="modal-content">
<div class="modal-header">
<h2 id="modal-title">Prompt Details</h2>
<button class="close" id="modal-close">&times;</button>
</div>
<div id="modal-body"></div>
</div>
</div>
<script>
const API='/api/v1';
const theme={current:localStorage.getItem('theme')||'dark',toggle(t){this.current=t;localStorage.setItem('theme',t);document.body.setAttribute('data-theme',t);this.up()},up(){document.getElementById('theme-dark').classList.toggle('active',this.current==='dark');document.getElementById('theme-light').classList.toggle('active',this.current==='light')},init(){document.body.setAttribute('data-theme',this.current);this.up()}};
theme.init();
document.getElementById('theme-dark').onclick=()=>theme.toggle('dark');
document.getElementById('theme-light').onclick=()=>theme.toggle('light');
const tabs=document.querySelectorAll('.tab');
const tabContents=document.querySelectorAll('.tab-content');
tabs.forEach(tab=>{tab.onclick=()=>{tabs.forEach(t=>t.classList.remove('active'));tabContents.forEach(c=>c.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.tab).classList.add('active');if(tab.dataset.tab==='library')loadLib();if(tab.dataset.tab==='keys')loadKeys();if(tab.dataset.tab==='playground')loadPgKeys()}});
const els={target:document.getElementById('target'),tone:document.getElementById('tone'),task:document.getElementById('task'),context:document.getElementById('context'),constraints:document.getElementById('constraints'),deliverables:document.getElementById('deliverables'),generate:document.getElementById('generate'),copy:document.getElementById('copy'),save:document.getElementById('save'),output:document.getElementById('output'),genError:document.getElementById('gen-error'),genSuccess:document.getElementById('gen-success')};
function err(el,m){el.style.display=m?'block':'none';el.textContent=m||''}
function succ(el,m){el.style.display=m?'block':'none';el.textContent=m||'';if(m)setTimeout(()=>el.style.display='none',3000)}
async function generate(){err(els.genError,'');els.generate.disabled=true;els.generate.textContent='Generating...';try{const r=await fetch(`${API}/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:els.target.value,tone:els.tone.value,task:els.task.value,context:els.context.value,constraints:els.constraints.value,deliverables:els.deliverables.value})});const d=await r.json();if(!r.ok){err(els.genError,d.error||'Failed');return}els.output.value=d.prompt||''}catch(e){err(els.genError,'Network error')}finally{els.generate.disabled=false;els.generate.textContent='Generate'}}
async function copy(){const t=els.output.value;if(!t)return;try{await navigator.clipboard.writeText(t);succ(els.genSuccess,'Copied!')}catch(e){err(els.genError,'Copy failed')}}
async function saveLib(){const p=els.output.value;if(!p){err(els.genError,'Generate first');return}try{const r=await fetch(`${API}/library/prompts`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:els.task.value.substring(0,50)||'Untitled',task:els.task.value,target:els.target.value,context:els.context.value,constraints:els.constraints.value,deliverables:els.deliverables.value,tone:els.tone.value,generated_prompt:p})});const d=await r.json();if(!r.ok){err(els.genError,d.error||'Failed');return}succ(els.genSuccess,'Saved!')}catch(e){err(els.genError,'Save failed')}}
els.generate.onclick=generate;
els.copy.onclick=copy;
els.save.onclick=saveLib;
const pg={provider:document.getElementById('pg-provider'),model:document.getElementById('pg-model'),keySelect:document.getElementById('pg-key-select'),keyInline:document.getElementById('pg-key-inline'),prompt:document.getElementById('pg-prompt'),execute:document.getElementById('pg-execute'),clear:document.getElementById('pg-clear'),response:document.getElementById('pg-response'),error:document.getElementById('pg-error'),meta:document.getElementById('pg-meta')};
const models={detached:['detached'],anthropic:['claude-3-5-sonnet-20241022','claude-3-5-haiku-20241022','claude-3-opus-20240229'],openai:['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'],openrouter:['anthropic/claude-3.5-sonnet','openai/gpt-4o','google/gemini-pro-1.5']};
pg.provider.onchange=()=>{const p=pg.provider.value;const m=models[p]||['detached'];pg.model.innerHTML=m.map(x=>`<option value="${x}">${x}</option>`).join('')};
async function loadPgKeys(){try{const r=await fetch(`${API}/keys`);const d=await r.json();pg.keySelect.innerHTML='<option value="">Use inline key or detached mode</option>'+d.keys.filter(k=>k.is_active).map(k=>`<option value="${k.id}">${k.key_name} (${k.provider})</option>`).join('')}catch(e){}}
async function execPg(){err(pg.error,'');pg.execute.disabled=true;pg.execute.textContent='Executing...';try{const b={provider:pg.provider.value,model:pg.model.value,prompt:pg.prompt.value};if(pg.keySelect.value){b.key_id=parseInt(pg.keySelect.value)}else if(pg.keyInline.value){b.api_key=pg.keyInline.value}const r=await fetch(`${API}/playground/execute`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok){err(pg.error,d.error||'Failed');return}pg.response.value=d.response||d.message||'';if(d.tokens_used||d.duration_ms){pg.meta.textContent=`Model: ${d.model} | Tokens: ${d.tokens_used||'N/A'} | Time: ${d.duration_ms}ms`}}catch(e){err(pg.error,'Error')}finally{pg.execute.disabled=false;pg.execute.textContent='Execute'}}
pg.execute.onclick=execPg;
pg.clear.onclick=()=>{pg.prompt.value='';pg.response.value='';pg.meta.textContent=''};
const lib={search:document.getElementById('lib-search'),refresh:document.getElementById('lib-refresh'),favorites:document.getElementById('lib-favorites'),grid:document.getElementById('library-grid')};
let favOnly=false;
async function loadLib(){try{const s=lib.search.value;const u=`${API}/library/prompts?${new URLSearchParams({search:s,favorites:favOnly})}`;const r=await fetch(u);const d=await r.json();lib.grid.innerHTML=d.prompts.length?d.prompts.map(p=>`<div class="prompt-card" onclick="showPrompt(${p.id})"><h3>${esc(p.name)}</h3><p>${esc(p.description||p.task.substring(0,100))}...</p><div class="tags">${p.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`).join(''):'<p style="text-align:center;color:var(--text-secondary)">No prompts</p>'}catch(e){lib.grid.innerHTML='<p style="color:var(--error-color)">Load failed</p>'}}
lib.refresh.onclick=loadLib;
lib.search.oninput=()=>setTimeout(loadLib,300);
lib.favorites.onclick=()=>{favOnly=!favOnly;lib.favorites.textContent=favOnly?'Show All':'Favorites Only';loadLib()};
async function showPrompt(id){try{const r=await fetch(`${API}/library/prompts/${id}`);const d=await r.json();const p=d.prompt;document.getElementById('modal-title').textContent=p.name;document.getElementById('modal-body').innerHTML=`<p><strong>Target:</strong> ${p.target}</p><p><strong>Task:</strong> ${esc(p.task)}</p>${p.context?`<p><strong>Context:</strong> ${esc(p.context)}</p>`:''}${p.generated_prompt?`<div><label>Generated Prompt</label><textarea readonly style="min-height:200px">${esc(p.generated_prompt)}</textarea></div>`:''}<div class="actions"><button onclick="copyP('${esc(p.generated_prompt).replace(/'/g,"\\'")}')">Copy</button><button class="secondary" onclick="delPrompt(${id})">Delete</button><button class="secondary" onclick="closeMod()">Close</button></div>`;document.getElementById('prompt-modal').classList.add('active')}catch(e){}}
function closeMod(){document.getElementById('prompt-modal').classList.remove('active')}
function copyP(t){navigator.clipboard.writeText(t);alert('Copied!')}
async function delPrompt(id){if(!confirm('Delete?'))return;try{await fetch(`${API}/library/prompts/${id}`,{method:'DELETE'});closeMod();loadLib()}catch(e){}}
document.getElementById('modal-close').onclick=closeMod;
const keys={provider:document.getElementById('key-provider'),name:document.getElementById('key-name'),value:document.getElementById('key-value'),add:document.getElementById('key-add'),list:document.getElementById('keys-list'),error:document.getElementById('key-error'),success:document.getElementById('key-success')};
async function loadKeys(){try{const r=await fetch(`${API}/keys`);const d=await r.json();keys.list.innerHTML='<h3>Your API Keys</h3>'+(d.keys.length?d.keys.map(k=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg-tertiary);border-radius:8px;margin-bottom:8px"><div><strong>${k.key_name}</strong> (${k.provider})<br><small>Added ${new Date(k.created_at).toLocaleDateString()}</small></div><button class="secondary" onclick="delKey(${k.id})">Delete</button></div>`).join(''):'<p style="text-align:center;color:var(--text-secondary)">No keys stored</p>')}catch(e){keys.list.innerHTML='<p style="color:var(--error-color)">Load failed</p>'}}
async function addKey(){err(keys.error,'');succ(keys.success,'');if(!keys.name.value||!keys.value.value){err(keys.error,'Name and key required');return}try{const r=await fetch(`${API}/keys`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:keys.provider.value,key_name:keys.name.value,api_key:keys.value.value})});const d=await r.json();if(!r.ok){err(keys.error,d.error||'Failed');return}succ(keys.success,'Added!');keys.name.value='';keys.value.value='';loadKeys();loadPgKeys()}catch(e){err(keys.error,'Failed')}}
async function delKey(id){if(!confirm('Delete?'))return;try{await fetch(`${API}/keys/${id}`,{method:'DELETE'});loadKeys();loadPgKeys()}catch(e){}}
keys.add.onclick=addKey;
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){if(document.querySelector('#generator').classList.contains('active'))generate()}})
</script>
</body>
</html>
