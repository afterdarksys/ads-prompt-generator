version: '3.8'

services:
  # Main application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=false
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=true
      - RATE_LIMIT_ENABLED=true
      - METRICS_ENABLED=true
      - SECRET_KEY=dev-secret-change-in-production
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: gunicorn --reload --workers 2 --bind 0.0.0.0:5000 --log-level debug "app:create_app()"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
    driver: local
