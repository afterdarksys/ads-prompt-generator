version: '3.8'

services:
  # Main API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Platform API Keys
      - DARKAPI_URL=https://api.darkapi.io/v1
      - DARKAPI_KEY=${DARKAPI_KEY}
      - LLMSECURITY_URL=https://api.llmsecurity.dev/v1
      - LLMSECURITY_KEY=${LLMSECURITY_KEY}
      - MODELS2GO_URL=https://api.models2go.com/v1
      - MODELS2GO_KEY=${MODELS2GO_KEY}
      - APIPROXY_URL=https://api.apiproxy.app/v1
      - APIPROXY_KEY=${APIPROXY_KEY}
      # LLM Provider Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Database
      - DATABASE_URL=postgresql://promptgen:promptgen@postgres:5432/prompt_generator
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./templates:/app/templates
    depends_on:
      - postgres
      - redis
    networks:
      - prompt-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=promptgen
      - POSTGRES_PASSWORD=promptgen
      - POSTGRES_DB=prompt_generator
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - prompt-network
    restart: unless-stopped

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - prompt-network
    restart: unless-stopped

  # Security Tools Worker (runs Garak, ART, etc.)
  security-worker:
    build:
      context: .
      dockerfile: Dockerfile.security
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://promptgen:promptgen@postgres:5432/prompt_generator
    volumes:
      - ./security_results:/app/results
    depends_on:
      - redis
      - postgres
    networks:
      - prompt-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  prompt-network:
    driver: bridge
